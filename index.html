<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사업자 정보 무료 조회</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
    .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
    input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 16px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .result-card { border: 1px solid #ddd; padding: 16px; border-radius: 8px; display: none; background-color: #f9f9f9; }
    .row { margin-bottom: 10px; }
    .label { font-weight: bold; width: 100px; display: inline-block; color: #555; }
  </style>
</head>
<body>

  <h2>사업자 정보 조회</h2>
  <div class="search-box">
    <input type="text" id="bizNo" placeholder="사업자번호 10자리 (- 제외)">
    <button onclick="search()">조회</button>
  </div>

  <div id="result" class="result-card">
    <div class="row"><span class="label">상호명:</span> <span id="companyName"></span></div>
    <div class="row"><span class="label">대표자명:</span> <span id="bossName"></span></div>
    <div class="row"><span class="label">주소:</span> <span id="address"></span></div>
    <div class="row"><span class="label">사이트주소:</span> <span id="domain"></span></div>
    <div class="row"><span class="label">상태:</span> <span id="status"></span></div>
  </div>

  <script>
    async function search() {
      const bizNo = document.getElementById('bizNo').value.trim();
      if (!bizNo) return alert('사업자번호를 입력하세요.');

      // ★ 생성한 구글 앱스 스크립트 배포 URL을 입력하세요.
      const GAS_URL = 'https://script.google.com/macros/s/AKfycbzkGrMSXMjYOAexIIaOj7GTB2bxaD1vPq5ruMXlMskMCGYxBgKSubpnf_zaDfPdT5yv/exec';

      try {
        // 앱스 스크립트로 GET 요청 전송
        const response = await fetch(`https://docs.google.com/spreadsheets/d/1j9YGQNMB-k6L6RdWq0BxGNHQw--ToWJgFwn8sm033sw/edit?gid=0#gid=0`);
        const data = await response.json();

        if (data.success) {
          document.getElementById('companyName').innerText = data.companyName;
          document.getElementById('bossName').innerText = data.bossName;
          document.getElementById('address').innerText = data.address;
          document.getElementById('domain').innerText = data.domain;
          document.getElementById('status').innerText = data.status;
          document.getElementById('result').style.display = 'block';
        } else {
          alert(data.message);
          document.getElementById('result').style.display = 'none';
        }
      } catch (error) {
        alert('조회 중 오류가 발생했습니다.');
        console.error(error);
      }
    }
  </script>
</body>
</html>
